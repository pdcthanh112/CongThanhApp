name: security
on:
  pull_request:
  schedule: [{cron: "0 2 * * 1"}]
permissions: {contents: read, security-events: write}
jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
  iac-and-deps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: "Trivy: lỗ hổng thư viện, cấu hình IaC (Terraform, Helm, K8s, Dockerfile), secret"
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: backend/app/ecommerce
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy.sarif
      - uses: github/codeql-action/upload-sarif@v3
        with: {sarif_file: trivy.sarif}
  codeql:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        language: [go, java-kotlin]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v3
        with: {languages: "${{ matrix.language }}", build-mode: "${{ matrix.language == 'go' && 'autobuild' || 'none' }}"}
      - uses: github/codeql-action/analyze@v3
  scorecard:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions: {security-events: write, id-token: write, contents: read}
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: ossf/scorecard-action@v2.4.3
        with: {results_file: scorecard.sarif, results_format: sarif, publish_results: true}
      - uses: github/codeql-action/upload-sarif@v3
        with: {sarif_file: scorecard.sarif}
