openapi: 3.1.0
info:
  title: cart-service
  version: 1.0.0
  description: Giỏ hàng (nhiều giỏ / khách, một giỏ mặc định).
servers:
- url: https://api.congthanh.vn
- url: http://localhost:9080
security:
- keycloak: []
paths:
  /api/ecommerce/carts/:
    post:
      summary: Tạo giỏ
      tags:
      - cart
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Cart'
                  status:
                    type: string
                    enum:
                    - Success
                    - Failed
                  errorCode:
                    type: integer
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                customerId:
                  type: string
                isDefault:
                  type: boolean
  /api/ecommerce/carts/customer/{customerId}:
    get:
      summary: Giỏ của khách
      tags:
      - cart
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Cart'
                  status:
                    type: string
                    enum:
                    - Success
                    - Failed
                  errorCode:
                    type: integer
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
  /api/ecommerce/carts/customer/{customerId}/default:
    get:
      summary: Giỏ mặc định
      tags:
      - cart
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Cart'
                  status:
                    type: string
                    enum:
                    - Success
                    - Failed
                  errorCode:
                    type: integer
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
  /api/ecommerce/carts/customer-backoffice/{customerId}:
    get:
      summary: Giỏ đang hoạt động (ADMIN)
      tags:
      - cart
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Cart'
                  status:
                    type: string
                    enum:
                    - Success
                    - Failed
                  errorCode:
                    type: integer
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
  /api/ecommerce/carts/{cartId}:
    get:
      summary: Chi tiết giỏ
      tags:
      - cart
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Cart'
                  status:
                    type: string
                    enum:
                    - Success
                    - Failed
                  errorCode:
                    type: integer
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      parameters:
      - &id001
        name: cartId
        in: path
        required: true
        schema:
          type: integer
    put:
      summary: Sửa giỏ
      tags:
      - cart
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Cart'
                  status:
                    type: string
                    enum:
                    - Success
                    - Failed
                  errorCode:
                    type: integer
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      parameters:
      - *id001
    delete:
      summary: Xoá giỏ
      tags:
      - cart
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    nullable: true
                  status:
                    type: string
                    enum:
                    - Success
                    - Failed
                  errorCode:
                    type: integer
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      parameters:
      - *id001
  /api/ecommerce/carts/{cartId}/validate:
    post:
      summary: Kiểm tra trước checkout (tồn kho, sản phẩm còn bán)
      tags:
      - cart
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Validation'
                  status:
                    type: string
                    enum:
                    - Success
                    - Failed
                  errorCode:
                    type: integer
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      parameters:
      - *id001
  /api/ecommerce/carts/{cartId}/items:
    get:
      summary: Item trong giỏ
      tags:
      - item
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CartItem'
                  status:
                    type: string
                    enum:
                    - Success
                    - Failed
                  errorCode:
                    type: integer
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      parameters:
      - *id001
    post:
      summary: Thêm sản phẩm (cộng dồn)
      tags:
      - item
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/CartItem'
                  status:
                    type: string
                    enum:
                    - Success
                    - Failed
                  errorCode:
                    type: integer
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                productId:
                  type: string
                quantity:
                  type: integer
      parameters:
      - *id001
    delete:
      summary: Xoá item (tất cả hoặc ?productId=)
      tags:
      - item
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                  status:
                    type: string
                    enum:
                    - Success
                    - Failed
                  errorCode:
                    type: integer
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      parameters:
      - *id001
      - name: productId
        in: query
        required: false
        schema:
          type: string
  /api/ecommerce/carts/{cartId}/items/{itemId}:
    put:
      summary: Đổi số lượng
      tags:
      - item
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/CartItem'
                  status:
                    type: string
                    enum:
                    - Success
                    - Failed
                  errorCode:
                    type: integer
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      parameters:
      - *id001
      - &id002
        name: itemId
        in: path
        required: true
        schema:
          type: integer
      - name: quantity
        in: query
        required: true
        schema:
          type: integer
    delete:
      summary: Xoá item
      tags:
      - item
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    nullable: true
                  status:
                    type: string
                    enum:
                    - Success
                    - Failed
                  errorCode:
                    type: integer
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      parameters:
      - *id001
      - *id002
  /api/ecommerce/carts/{cartId}/items/{itemId}/detail:
    get:
      summary: Item kèm thông tin sản phẩm
      tags:
      - item
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                  status:
                    type: string
                    enum:
                    - Success
                    - Failed
                  errorCode:
                    type: integer
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      parameters:
      - *id001
      - *id002
components:
  securitySchemes:
    keycloak:
      type: openIdConnect
      openIdConnectUrl: https://auth.congthanh.vn/realms/ecommerce/.well-known/openid-configuration
  responses:
    Error:
      description: Lỗi
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
              data:
                nullable: true
              status:
                type: string
                enum:
                - Success
                - Failed
              errorCode:
                type: integer
  schemas:
    CartItem:
      type: object
      properties:
        id:
          type: integer
        cart:
          type: integer
        product:
          type: string
        quantity:
          type: integer
        createdAt:
          type: string
          format: date-time
    Cart:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        customer:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
        isDefault:
          type: boolean
        countItem:
          type: integer
        cartItems:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
    Validation:
      type: object
      properties:
        cartId:
          type: integer
        valid:
          type: boolean
        items:
          type: array
          items:
            type: object
