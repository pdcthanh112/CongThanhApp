syntax = "proto3";

package ecommerce.order.v1;

import "ecommerce/common/v1/money.proto";

option java_multiple_files = true;
option java_package = "com.congthanh.ecom.order.v1";

// Topic: ecom.order.events (key = order_id)

message OrderLine {
  string product_id = 1;
  int32 quantity = 2;
  ecommerce.common.v1.Money unit_price = 3;
}

message OrderPlaced {
  string order_id = 1;
  string customer_id = 2;
  repeated OrderLine lines = 3;
  ecommerce.common.v1.Money total = 4;
  string checkout_workflow_id = 5;
  // Địa chỉ giao hàng chụp lại lúc đặt (shipping-service tạo vận đơn từ đây). Trống ở event cũ.
  ShippingAddress shipping_address = 6;
}

message ShippingAddress {
  string recipient_name = 1;
  string phone = 2;
  string line1 = 3;
  string line2 = 4;
  string ward = 5;
  string district = 6;
  // Mã tỉnh/thành, cùng mã với customer-service.
  string region_code = 7;
  string postal_code = 8;
  // ISO 3166-1 alpha-2.
  string country_code = 9;
}

message OrderConfirmed {
  string order_id = 1;
  string payment_id = 2;
}

message OrderCancelled {
  string order_id = 1;
  string reason = 2;
  // Reservation tồn kho của saga (inventory-service tự trả hàng khi nhận event này).
  string reservation_id = 3;
}
