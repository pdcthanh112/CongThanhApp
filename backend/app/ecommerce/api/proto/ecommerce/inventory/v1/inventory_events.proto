syntax = "proto3";

package ecommerce.inventory.v1;

option java_multiple_files = true;
option java_package = "com.congthanh.inventoryservice.grpc";

// Topic: ecom.inventory.events (key = reservation_id hoặc product_id)

message ReservedLine {
  string product_id = 1;
  string warehouse_id = 2;
  int32 quantity = 3;
}

message InventoryReserved {
  string reservation_id = 1;
  string customer_id = 2;
  repeated ReservedLine lines = 3;
  int64 expires_at = 4;
}

message InventoryReservationFailed {
  string reservation_id = 1;
  string reason = 2;
}

message InventoryReleased {
  string reservation_id = 1;
  repeated ReservedLine lines = 2;
  string reason = 3;
  bool expired = 4;
}

message InventoryCommitted {
  string reservation_id = 1;
  string order_id = 2;
  repeated ReservedLine lines = 3;
}

message StockLevelChanged {
  string product_id = 1;
  string warehouse_id = 2;
  int32 quantity = 3;
  int32 available = 4;
  // RESTOCK, DAMAGE, ADJUST, COMMIT...
  string reason = 5;
}

message LowStockDetected {
  string product_id = 1;
  int32 available = 2;
  int32 reorder_point = 3;
}

// Flash sale: lượt giành hàng thành công trên Redis. order-service tiêu thụ để tạo đơn
// bất đồng bộ; kết thúc đợt sale, inventory chốt số đã bán vào DB (đối soát).
message FlashSaleClaimed {
  string sale_id = 1;
  string product_id = 2;
  string customer_id = 3;
  int32 quantity = 4;
  string claim_id = 5;
}
