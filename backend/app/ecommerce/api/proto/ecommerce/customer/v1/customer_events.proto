syntax = "proto3";

package ecommerce.customer.v1;

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "com.congthanh.customerservice.grpc";

// Event của customer-service (aggregatetype "customer" → topic ecom.customer.events).
// notification-service dùng để báo giảm giá/có hàng lại cho sản phẩm trong wishlist;
// search-service dùng làm tín hiệu cá nhân hoá.

message WishlistItemAdded {
  string customer_id = 1;
  string product_id = 2;
  google.protobuf.Timestamp added_at = 3;
}

message WishlistItemRemoved {
  string customer_id = 1;
  string product_id = 2;
}
