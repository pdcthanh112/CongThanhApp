syntax = "proto3";

package ecommerce.shipping.v1;

import "ecommerce/common/v1/money.proto";
import "ecommerce/order/v1/order_events.proto";

option java_multiple_files = true;
option java_package = "com.congthanh.ecom.shipping.v1";

// shipping-service (Go). order-service gọi QuoteShipping khi checkout để hiện phí giao hàng.
service ShippingService {
  rpc QuoteShipping(QuoteShippingRequest) returns (QuoteShippingResponse);
  rpc GetShipment(GetShipmentRequest) returns (GetShipmentResponse);
}

message Parcel {
  // Tổng khối lượng (gram) và giá trị khai báo của đơn.
  int32 weight_grams = 1;
  ecommerce.common.v1.Money declared_value = 2;
}

message QuoteShippingRequest {
  ecommerce.order.v1.ShippingAddress destination = 1;
  Parcel parcel = 2;
}

message ShippingQuote {
  // Mã hãng vận chuyển, ví dụ "ghn", "ghtk", "internal".
  string carrier = 1;
  // Mã dịch vụ của hãng, ví dụ "standard", "express".
  string service_code = 2;
  string service_name = 3;
  ecommerce.common.v1.Money fee = 4;
  int32 estimated_days_min = 5;
  int32 estimated_days_max = 6;
}

message QuoteShippingResponse {
  repeated ShippingQuote quotes = 1;
}

message GetShipmentRequest {
  string order_id = 1;
}

message Shipment {
  string id = 1;
  string order_id = 2;
  string carrier = 3;
  string service_code = 4;
  string tracking_number = 5;
  // PENDING, LABEL_CREATED, PICKED_UP, IN_TRANSIT, OUT_FOR_DELIVERY, DELIVERED, FAILED, RETURNED, CANCELLED.
  string status = 6;
  ecommerce.order.v1.ShippingAddress address = 7;
}

message GetShipmentResponse {
  Shipment shipment = 1;
}
