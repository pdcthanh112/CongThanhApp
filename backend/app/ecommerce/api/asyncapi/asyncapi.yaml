# SINH từ api/proto/ecommerce/*/v1/*_events.proto bằng tools/scripts/gen-asyncapi.py
asyncapi: 3.0.0
info:
  title: CongThanhApp e-commerce events
  version: 1.0.0
  description: Event miền trên Kafka. Mỗi record là ecommerce.common.v1.EventEnvelope
    (Protobuf) bọc event trong `payload` (Any). Header ce_type = tên đầy đủ của event,
    traceparent = W3C trace context. Key = aggregate id.
defaultContentType: application/x-protobuf
servers:
  local:
    host: localhost:29092
    protocol: kafka
  prod:
    host: ecom-kafka-bootstrap.messaging.svc.cluster.local:9092
    protocol: kafka
    security:
    - type: scramSha512
channels:
  cartEvents:
    address: ecom.cart.events
    messages:
      CartItemAdded:
        $ref: '#/components/messages/cart.CartItemAdded'
      CartItemRemoved:
        $ref: '#/components/messages/cart.CartItemRemoved'
      CartCleared:
        $ref: '#/components/messages/cart.CartCleared'
    description: 'Event của cart-service; DLQ: ecom.cart.events.dlq'
  catalogEvents:
    address: ecom.catalog.events
    messages:
      CategoryUpserted:
        $ref: '#/components/messages/catalog.CategoryUpserted'
      BrandUpserted:
        $ref: '#/components/messages/catalog.BrandUpserted'
      ProductTagsChanged:
        $ref: '#/components/messages/catalog.ProductTagsChanged'
    description: 'Event của catalog-service; DLQ: ecom.catalog.events.dlq'
  customerEvents:
    address: ecom.customer.events
    messages:
      WishlistItemAdded:
        $ref: '#/components/messages/customer.WishlistItemAdded'
      WishlistItemRemoved:
        $ref: '#/components/messages/customer.WishlistItemRemoved'
    description: 'Event của customer-service; DLQ: ecom.customer.events.dlq'
  inventoryEvents:
    address: ecom.inventory.events
    messages:
      InventoryReserved:
        $ref: '#/components/messages/inventory.InventoryReserved'
      InventoryReservationFailed:
        $ref: '#/components/messages/inventory.InventoryReservationFailed'
      InventoryReleased:
        $ref: '#/components/messages/inventory.InventoryReleased'
      InventoryCommitted:
        $ref: '#/components/messages/inventory.InventoryCommitted'
      StockLevelChanged:
        $ref: '#/components/messages/inventory.StockLevelChanged'
      LowStockDetected:
        $ref: '#/components/messages/inventory.LowStockDetected'
      FlashSaleClaimed:
        $ref: '#/components/messages/inventory.FlashSaleClaimed'
    description: 'Event của inventory-service; DLQ: ecom.inventory.events.dlq'
  messageEvents:
    address: ecom.message.events
    messages:
      MessageSent:
        $ref: '#/components/messages/message.MessageSent'
    description: 'Event của message-service; DLQ: ecom.message.events.dlq'
  orderEvents:
    address: ecom.order.events
    messages:
      OrderPlaced:
        $ref: '#/components/messages/order.OrderPlaced'
      ShippingAddress:
        $ref: '#/components/messages/order.ShippingAddress'
      OrderConfirmed:
        $ref: '#/components/messages/order.OrderConfirmed'
      OrderCancelled:
        $ref: '#/components/messages/order.OrderCancelled'
    description: 'Event của order-service; DLQ: ecom.order.events.dlq'
  paymentEvents:
    address: ecom.payment.events
    messages:
      PaymentAuthorized:
        $ref: '#/components/messages/payment.PaymentAuthorized'
      PaymentFailed:
        $ref: '#/components/messages/payment.PaymentFailed'
      PaymentRefunded:
        $ref: '#/components/messages/payment.PaymentRefunded'
    description: 'Event của payment-service; DLQ: ecom.payment.events.dlq'
  productEvents:
    address: ecom.product.events
    messages:
      ProductUpserted:
        $ref: '#/components/messages/product.ProductUpserted'
      ProductDeleted:
        $ref: '#/components/messages/product.ProductDeleted'
    description: 'Event của product-service; DLQ: ecom.product.events.dlq'
  promotionEvents:
    address: ecom.promotion.events
    messages:
      PromotionActivated:
        $ref: '#/components/messages/promotion.PromotionActivated'
      PromotionExpired:
        $ref: '#/components/messages/promotion.PromotionExpired'
      PromotionRedeemed:
        $ref: '#/components/messages/promotion.PromotionRedeemed'
      RedemptionCancelled:
        $ref: '#/components/messages/promotion.RedemptionCancelled'
    description: 'Event của promotion-service; DLQ: ecom.promotion.events.dlq'
  reviewEvents:
    address: ecom.review.events
    messages:
      ReviewSubmitted:
        $ref: '#/components/messages/review.ReviewSubmitted'
      ReviewModerated:
        $ref: '#/components/messages/review.ReviewModerated'
      ReviewReplied:
        $ref: '#/components/messages/review.ReviewReplied'
      ProductRatingChanged:
        $ref: '#/components/messages/review.ProductRatingChanged'
    description: 'Event của review-service; DLQ: ecom.review.events.dlq'
  shippingEvents:
    address: ecom.shipping.events
    messages:
      ShipmentCreated:
        $ref: '#/components/messages/shipping.ShipmentCreated'
      ShipmentStatusChanged:
        $ref: '#/components/messages/shipping.ShipmentStatusChanged'
    description: 'Event của shipping; DLQ: ecom.shipping.events.dlq'
operations:
  publishCartEvents:
    action: send
    channel:
      $ref: '#/channels/cartEvents'
    summary: cart-service ghi qua outbox → Debezium
  publishCatalogEvents:
    action: send
    channel:
      $ref: '#/channels/catalogEvents'
    summary: catalog-service ghi qua outbox → Debezium
  publishCustomerEvents:
