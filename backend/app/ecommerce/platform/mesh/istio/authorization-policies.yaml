# Zero trust: từ chối mặc định, chỉ mở các đường gọi đồng bộ trong kiến trúc.
# Event bất đồng bộ đi qua Kafka nên không cần mở service-to-service cho chúng.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: deny-by-default
  namespace: ecommerce
spec: {}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-inventory-service
  namespace: ecommerce
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-service
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - cluster.local/ns/ecommerce/sa/cart-service
        - cluster.local/ns/ecommerce/sa/order-service
        - cluster.local/ns/ecommerce/sa/storefront-bff
        - cluster.local/ns/ecommerce/sa/backoffice-bff
        - cluster.local/ns/gateway/sa/apisix
  - from:
    - source:
        namespaces:
        - observability
    to:
    - operation:
        ports:
        - '9464'
        - '8080'
---
