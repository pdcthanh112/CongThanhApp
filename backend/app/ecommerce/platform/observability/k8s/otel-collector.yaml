# OpenTelemetry Operator: collector dạng DaemonSet (thu từ node) + Instrumentation tự động cho Java.
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel
  namespace: observability
spec:
  mode: deployment
  replicas: 2
  autoscaler: {minReplicas: 2, maxReplicas: 10, targetCPUUtilization: 70}
  config:
    receivers:
      otlp:
        protocols: {grpc: {endpoint: 0.0.0.0:4317}, http: {endpoint: 0.0.0.0:4318}}
    processors:
      memory_limiter: {check_interval: 1s, limit_percentage: 80, spike_limit_percentage: 20}
      k8sattributes: {extract: {metadata: [k8s.namespace.name, k8s.pod.name, k8s.deployment.name, k8s.node.name]}}
      batch: {}
      tail_sampling:
        decision_wait: 10s
        policies:
          - {name: errors, type: status_code, status_code: {status_codes: [ERROR]}}
          - {name: slow, type: latency, latency: {threshold_ms: 1000}}
          - {name: baseline, type: probabilistic, probabilistic: {sampling_percentage: 10}}
    connectors:
      spanmetrics: {exemplars: {enabled: true}}
      servicegraph: {}
    exporters:
      otlp/tempo: {endpoint: "lgtm-tempo-distributor.observability:4317", tls: {insecure: true}}
      prometheusremotewrite: {endpoint: "http://lgtm-mimir-nginx.observability/api/v1/push"}
      otlphttp/loki: {endpoint: "http://lgtm-loki-gateway.observability/otlp"}
    service:
      pipelines:
        traces/spanmetrics: {receivers: [otlp], processors: [memory_limiter, k8sattributes, batch], exporters: [spanmetrics, servicegraph]}
        traces: {receivers: [otlp], processors: [memory_limiter, k8sattributes, tail_sampling, batch], exporters: [otlp/tempo]}
        metrics: {receivers: [otlp, spanmetrics, servicegraph], processors: [memory_limiter, k8sattributes, batch], exporters: [prometheusremotewrite]}
        logs: {receivers: [otlp], processors: [memory_limiter, k8sattributes, batch], exporters: [otlphttp/loki]}
---
apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: java
  namespace: ecommerce
spec:
  exporter: {endpoint: http://otel-collector.observability.svc.cluster.local:4318}
  propagators: [tracecontext, baggage]
  sampler: {type: parentbased_traceidratio, argument: "1"}
  java:
    env:
      - {name: OTEL_INSTRUMENTATION_MICROMETER_ENABLED, value: "true"}
