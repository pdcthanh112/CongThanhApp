# SINH từ danh sách SLO; mục tiêu: checkout 99.9%, cart 99.9%, reserve 99.95%, flash sale 99.5%.
groups:
- name: slo-checkout-availability
  rules:
  - record: slo:error_ratio:5m
    labels:
      slo: checkout-availability
    expr: sum(rate(traces_span_metrics_calls_total{service_name="order-service",http_route=~"/api/ecommerce/checkout.*",status_code="STATUS_CODE_ERROR"}[5m])) / sum(rate(traces_span_metrics_calls_total{service_name="order-service",http_route=~"/api/ecommerce/checkout.*"}[5m]))
  - record: slo:error_ratio:30m
    labels:
      slo: checkout-availability
    expr: sum(rate(traces_span_metrics_calls_total{service_name="order-service",http_route=~"/api/ecommerce/checkout.*",status_code="STATUS_CODE_ERROR"}[30m])) / sum(rate(traces_span_metrics_calls_total{service_name="order-service",http_route=~"/api/ecommerce/checkout.*"}[30m]))
  - record: slo:error_ratio:1h
    labels:
      slo: checkout-availability
    expr: sum(rate(traces_span_metrics_calls_total{service_name="order-service",http_route=~"/api/ecommerce/checkout.*",status_code="STATUS_CODE_ERROR"}[1h])) / sum(rate(traces_span_metrics_calls_total{service_name="order-service",http_route=~"/api/ecommerce/checkout.*"}[1h]))
  - record: slo:error_ratio:6h
    labels:
      slo: checkout-availability
    expr: sum(rate(traces_span_metrics_calls_total{service_name="order-service",http_route=~"/api/ecommerce/checkout.*",status_code="STATUS_CODE_ERROR"}[6h])) / sum(rate(traces_span_metrics_calls_total{service_name="order-service",http_route=~"/api/ecommerce/checkout.*"}[6h]))
  - alert: SLOBurnFast
    labels:
      slo: checkout-availability
      severity: page
    expr: slo:error_ratio:5m{slo="checkout-availability"} > 0.014400000000000001 and slo:error_ratio:1h{slo="checkout-availability"} > 0.014400000000000001
    for: 2m
    annotations:
      summary: 'checkout-availability: đốt error budget nhanh (2% ngân sách/giờ)'
      runbook_url: docs/runbooks/slo-burn.md
  - alert: SLOBurnSlow
    labels:
      slo: checkout-availability
      severity: ticket
    expr: slo:error_ratio:30m{slo="checkout-availability"} > 0.006 and slo:error_ratio:6h{slo="checkout-availability"} > 0.006
    for: 15m
    annotations:
      summary: 'checkout-availability: đốt error budget chậm (5% ngân sách/6 giờ)'
      runbook_url: docs/runbooks/slo-burn.md
