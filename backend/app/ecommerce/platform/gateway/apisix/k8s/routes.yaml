# FILE SINH TỰ ĐỘNG từ platform/gateway/routes.yaml — đừng sửa tay.
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: cart
  namespace: gateway
spec:
  ingressClassName: apisix
  http:
  - name: cart
    match:
      paths:
      - /api/ecommerce/carts*
    backends:
    - serviceName: cart-service
      servicePort: 80
      resolveGranularity: service
    plugins:
    - name: limit-count
      enable: true
      config:
        count: 300
        time_window: 60
        key: remote_addr
        rejected_code: 429
        policy: redis
        redis_host: valkey.data.svc.cluster.local
        allow_degradation: true
    - name: openid-connect
      enable: true
      config:
        discovery: http://keycloak.identity.svc.cluster.local/realms/ecommerce/.well-known/openid-configuration
        client_id: apisix-gateway
        client_secret: $secret://vault/apisix/keycloak-client-secret
        bearer_only: true
        use_jwks: true
        set_userinfo_header: false
---
