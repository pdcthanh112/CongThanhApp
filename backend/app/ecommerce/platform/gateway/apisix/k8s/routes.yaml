apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: flash-sale
  namespace: gateway
spec:
  ingressClassName: apisix
  http:
  - name: flash-sale
    match:
      paths:
      - /api/ecommerce/flash-sales*
    backends:
    - serviceName: inventory-service
      servicePort: 80
      resolveGranularity: service
    plugins:
    - name: limit-count
      enable: true
      config:
        count: 5
        time_window: 10
        key: consumer_name
        rejected_code: 429
        policy: redis
        redis_host: valkey.data.svc.cluster.local
        allow_degradation: true
    - name: limit-conn
      enable: true
      config:
        conn: 2000
        burst: 200
        default_conn_delay: 0.1
        key: server_addr
        rejected_code: 503
    - name: openid-connect
      enable: true
      config:
        discovery: http://keycloak.identity.svc.cluster.local/realms/ecommerce/.well-known/openid-configuration
        client_id: apisix-gateway
        client_secret: $secret://vault/apisix/keycloak-client-secret
        bearer_only: true
        use_jwks: true
        set_userinfo_header: false
---
