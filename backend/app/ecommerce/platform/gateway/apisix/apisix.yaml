# FILE SINH TỰ ĐỘNG từ platform/gateway/routes.yaml — đừng sửa tay.
routes:
- id: cart
  uris:
  - /api/ecommerce/carts*
  upstream_id: cart
  plugins:
    limit-count:
      count: 300
      time_window: 60
      key: remote_addr
      rejected_code: 429
      policy: redis
      redis_host: valkey
      allow_degradation: true
    openid-connect:
      discovery: http://keycloak:8080/realms/ecommerce/.well-known/openid-configuration
      client_id: apisix-gateway
      client_secret: $ENV://KEYCLOAK_GATEWAY_SECRET
      bearer_only: true
      use_jwks: true
      set_userinfo_header: false
- id: inventory
  uris:
  - /api/ecommerce/inventory*
  - /api/ecommerce/warehouses*
  upstream_id: inventory
  plugins:
    limit-count:
      count: 300
      time_window: 60
      key: remote_addr
      rejected_code: 429
      policy: redis
      redis_host: valkey
      allow_degradation: true
- id: flash-sale
  uris:
  - /api/ecommerce/flash-sales*
  upstream_id: flash-sale
  plugins:
    limit-count:
      count: 5
      time_window: 10
      key: consumer_name
      rejected_code: 429
      policy: redis
      redis_host: valkey
      allow_degradation: true
    limit-conn:
      conn: 2000
      burst: 200
      default_conn_delay: 0.1
      key: server_addr
      rejected_code: 503
    openid-connect:
      discovery: http://keycloak:8080/realms/ecommerce/.well-known/openid-configuration
      client_id: apisix-gateway
      client_secret: $ENV://KEYCLOAK_GATEWAY_SECRET
      bearer_only: true
      use_jwks: true
      set_userinfo_header: false
