# Valkey (fork mã nguồn mở của Redis): cache, rate limit APISIX, kho flash sale (Lua).
# Trên AWS dùng ElastiCache Valkey — infra/terraform/modules/elasticache.
# Helm bitnami/valkey không còn image miễn phí → dùng chart chính thức valkey-io/valkey.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: valkey
  namespace: data
spec:
  interval: 1h
  chart:
    spec:
      chart: valkey
      version: "0.7.x"
      sourceRef: {kind: HelmRepository, name: valkey, namespace: flux-system}
  values:
    replica: {enabled: true, replicas: 2}
    sentinel: {enabled: true}
    auth: {enabled: true, existingSecret: valkey-auth}
    metrics: {enabled: true, serviceMonitor: {enabled: true}}
