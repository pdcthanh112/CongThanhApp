# Quyền tối thiểu: mỗi service một KafkaUser (SCRAM), secret đồng bộ sang namespace service qua ESO.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: inventory-service
  namespace: messaging
  labels:
    strimzi.io/cluster: ecom
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
    - resource:
        type: topic
        name: ecom.order.events
      operations:
      - Read
      - Describe
    - resource:
        type: topic
        name: ecom.order.events.dlq
      operations:
      - Write
      - Describe
    - resource:
        type: group
        name: inventory-service
      operations:
      - Read
    - resource:
        type: topic
        name: ecom.inventory.events
      operations:
      - Write
      - Describe
---
