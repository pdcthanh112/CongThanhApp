# Kafka KRaft (không ZooKeeper) qua Strimzi, namespace messaging.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: messaging
  labels: {strimzi.io/cluster: ecom}
spec:
  replicas: 3
  roles: [controller, broker]
  storage:
    type: jbod
    volumes:
      - {id: 0, type: persistent-claim, size: 200Gi, deleteClaim: false, kraftMetadata: shared, class: gp3}
  resources:
    requests: {cpu: "1", memory: 4Gi}
    limits: {memory: 4Gi}
  template:
    pod:
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: DoNotSchedule, labelSelector: {matchLabels: {strimzi.io/pool-name: dual-role}}}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: ecom
  namespace: messaging
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.1.0
    listeners:
      # Trong cluster mTLS đã do Istio Ambient lo → listener plain, xác thực bằng SCRAM.
      - {name: plain, port: 9092, type: internal, tls: false, authentication: {type: scram-sha-512}}
    authorization:
      type: simple
    config:
      default.replication.factor: 3
      min.insync.replicas: 2
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      auto.create.topics.enable: false
      log.retention.hours: 168
    rack:
      topologyKey: topology.kubernetes.io/zone
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom: {configMapKeyRef: {name: kafka-metrics, key: kafka-metrics-config.yml}}
  entityOperator:
    topicOperator: {}
    userOperator: {}
  cruiseControl: {}
  kafkaExporter:
    topicRegex: "ecom\\..*"
    groupRegex: ".*"
