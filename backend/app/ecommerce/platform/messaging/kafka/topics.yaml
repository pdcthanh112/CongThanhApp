# Topic sự kiện miền (key = aggregate id) + DLQ cho từng topic + topic compact cho CQRS.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: ecom-inventory-events
  namespace: messaging
  labels:
    strimzi.io/cluster: ecom
spec:
  topicName: ecom.inventory.events
  partitions: 12
  replicas: 3
  config:
    retention.ms: 604800000
    cleanup.policy: delete
    min.insync.replicas: 2
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: ecom-inventory-events-dlq
  namespace: messaging
  labels:
    strimzi.io/cluster: ecom
spec:
  topicName: ecom.inventory.events.dlq
  partitions: 3
  replicas: 3
  config:
    retention.ms: 1209600000
    cleanup.policy: delete
---
