# Outbox Event Router: bảng <schema>.outbox → topic ecom.<aggregatetype>.events.
# inventory, cart (Go); order/payment/promotion/product (Java, đợt 2);
# catalog/customer/review/message (NestJS, đợt 3: schema <svc>_service, cùng cấu trúc bảng outbox).
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaConnector
metadata:
  name: inventory-outbox
  namespace: messaging
  labels:
    strimzi.io/cluster: debezium
spec:
  class: io.debezium.connector.postgresql.PostgresConnector
  tasksMax: 1
  config:
    plugin.name: pgoutput
    database.hostname: ecom-db-rw.data.svc.cluster.local
    database.port: '5432'
    database.dbname: ecommerce
    database.user: ${secrets:messaging/debezium-db:username}
    database.password: ${secrets:messaging/debezium-db:password}
    topic.prefix: cdc.inventory
    schema.include.list: inventory
    table.include.list: inventory.outbox
    slot.name: debezium_inventory
    publication.name: dbz_inventory_outbox
    publication.autocreate.mode: filtered
    tombstones.on.delete: 'false'
    transforms: outbox
    transforms.outbox.type: io.debezium.transforms.outbox.EventRouter
    transforms.outbox.route.by.field: aggregatetype
    transforms.outbox.route.topic.replacement: ecom.${routedByValue}.events
    transforms.outbox.table.field.event.key: aggregateid
    transforms.outbox.table.field.event.payload: payload
    transforms.outbox.table.fields.additional.placement: type:header:ce_type,traceparent:header:traceparent,id:header:ce_id
    key.converter: org.apache.kafka.connect.storage.StringConverter
    value.converter: io.debezium.converters.BinaryDataConverter
    heartbeat.interval.ms: '10000'
---
