# Helm hashicorp/vault: HA Raft, auto-unseal bằng AWS KMS. Auth K8s cho External Secrets Operator.
server:
  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true
      config: |
        ui = true
        listener "tcp" { address = "[::]:8200" cluster_address = "[::]:8201" tls_disable = 1 }
        storage "raft" { path = "/vault/data" }
        seal "awskms" { region = "ap-southeast-1" kms_key_id = "alias/congthanhapp-vault" }
        service_registration "kubernetes" {}
injector: {enabled: false}   # dùng ESO thay cho sidecar injector
