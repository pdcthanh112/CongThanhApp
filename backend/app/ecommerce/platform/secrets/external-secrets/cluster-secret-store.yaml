apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef: {name: external-secrets, namespace: external-secrets}
---
# Ví dụ: secret của inventory-service (chart microservice tự tạo ExternalSecret tương tự từ values).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: inventory-service
  namespace: ecommerce
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault}
  target: {name: inventory-service, creationPolicy: Owner}
  data:
    - {secretKey: DATABASE_URL, remoteRef: {key: ecommerce/inventory-service, property: database_url}}
    - {secretKey: KAFKA_PASSWORD, remoteRef: {key: ecommerce/inventory-service, property: kafka_password}}
    - {secretKey: UNLEASH_TOKEN, remoteRef: {key: ecommerce/inventory-service, property: unleash_token}}
