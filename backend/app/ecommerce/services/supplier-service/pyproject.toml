[project]
name = "supplier-service"
version = "0.1.0"
description = "Nhà cung cấp (gian hàng) của người bán: Django + DRF trên Postgres."
requires-python = ">=3.13"
dependencies = [
  "ecom-platform",
  "django==6.1.2",
  "djangorestframework==3.18.3",
  "psycopg[binary,pool]==3.3.6",
  "gunicorn==26.2.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-django==4.14.0", "ruff==0.17.2"]

[tool.uv.sources]
ecom-platform = { path = "../../libs/python/ecom-platform", editable = true }

[tool.uv]
# Chỉ nhận bản phát hành đã ra ít nhất 2 tuần (chính sách supply chain); nâng mốc khi cập nhật lock.
exclude-newer = "2026-10-27T00:00:00Z"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["suppliers/migrations"]

[tool.ruff.lint]
# Bộ luật cố định trong repo, không phụ thuộc cấu hình ruff trên máy dev.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "RUF012"]  # E501: độ dài dòng do ruff format lo
