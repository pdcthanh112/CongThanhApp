[project]
name = "ecom-platform"
version = "0.1.0"
description = "Dùng chung cho service Python: xác thực JWT (Keycloak JWKS), log JSON, health check."
requires-python = ">=3.13"
dependencies = [
  "PyJWT[crypto]==2.15.1",
]

[project.optional-dependencies]
fastapi = ["fastapi==0.162.0"]

[dependency-groups]
dev = ["pytest==9.1.1", "fastapi==0.162.0", "httpx==0.28.1", "ruff==0.17.2"]

[tool.uv]
exclude-newer = "2026-10-27T00:00:00Z"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecom_platform"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# Bộ luật cố định trong repo, không phụ thuộc cấu hình ruff trên máy dev.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "RUF012"]  # E501: độ dài dòng do ruff format lo
