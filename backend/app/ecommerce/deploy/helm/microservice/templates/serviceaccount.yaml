# ServiceAccount = danh tính SPIFFE trong Istio Ambient (dùng trong AuthorizationPolicy).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ms.name" . }}
  labels: {{- include "ms.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  # Ví dụ IRSA (EKS): eks.amazonaws.com/role-arn để pod lấy credential AWS không cần access key.
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
