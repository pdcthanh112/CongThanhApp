{{- if .Values.secretEnv }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "ms.name" . }}
  labels: {{- include "ms.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault}
  target: {name: {{ include "ms.name" . }}, creationPolicy: Owner}
  data:
    {{- range .Values.secretEnv }}
    - secretKey: {{ .name }}
      remoteRef: {key: {{ .key }}, property: {{ .property }}}
    {{- end }}
{{- end }}
