# customer-service: địa chỉ giao hàng, wishlist, lịch sử tìm kiếm (GraphQL subgraph + gRPC).
# Giá trị chung mọi môi trường; ghi đè theo môi trường ở values-<env>.yaml.
nameOverride: customer-service
runtime: node
image:
  repository: ghcr.io/pdcthanh112/congthanhapp/customer-service
ports:
  http: 5004
  grpc: 19094
migrations:
  enabled: true
env:
  OIDC_ISSUER_URI: "http://keycloak-service.identity.svc.cluster.local:8080/realms/ecommerce"
  JWT_JWKS_URL: "http://keycloak-service.identity.svc.cluster.local:8080/realms/ecommerce/protocol/openid-connect/certs"
  DB_SCHEMA: customer_service
secretEnv:
- name: DATABASE_URL
  key: ecommerce/customer-service
  property: database_url
resources:
  requests: {cpu: 100m, memory: 192Mi}
  limits: {memory: 384Mi}
