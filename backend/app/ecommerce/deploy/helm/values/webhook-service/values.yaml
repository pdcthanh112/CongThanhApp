# webhook-service: giá trị chung mọi môi trường. Ghi đè theo môi trường ở values-<env>.yaml.
nameOverride: webhook-service
runtime: go
image:
  repository: ghcr.io/pdcthanh112/congthanhapp/webhook-service
ports:
  http: 5023
env:
  DB_SCHEMA: webhook
  KAFKA_BROKERS: ecom-kafka-bootstrap.messaging.svc.cluster.local:9092
  JWT_JWKS_URL: http://keycloak-service.identity.svc.cluster.local:8080/realms/ecommerce/protocol/openid-connect/certs
secretEnv:
- name: DATABASE_URL
  key: ecommerce/webhook-service
  property: database_url
keda:
  enabled: true
  kafka:
    consumerGroup: webhook-service
    topic: ecom.order.events
