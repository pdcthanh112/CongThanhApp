# catalog-service: danh mục, thương hiệu, tag, quốc gia (GraphQL subgraph + gRPC).
# Giá trị chung mọi môi trường; ghi đè theo môi trường ở values-<env>.yaml.
nameOverride: catalog-service
runtime: node
image:
  repository: ghcr.io/pdcthanh112/congthanhapp/catalog-service
ports:
  http: 5003
  grpc: 19092
migrations:
  enabled: true
env:
  OIDC_ISSUER_URI: "http://keycloak-service.identity.svc.cluster.local:8080/realms/ecommerce"
  JWT_JWKS_URL: "http://keycloak-service.identity.svc.cluster.local:8080/realms/ecommerce/protocol/openid-connect/certs"
  DB_SCHEMA: catalog_service
  PRODUCT_GRPC_ADDR: "product-service:29090"
secretEnv:
- name: DATABASE_URL
  key: ecommerce/catalog-service
  property: database_url
resources:
  requests: {cpu: 100m, memory: 192Mi}
  limits: {memory: 384Mi}
