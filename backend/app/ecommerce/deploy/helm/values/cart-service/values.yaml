# cart-service: giá trị chung mọi môi trường. Ghi đè theo môi trường ở values-<env>.yaml.
nameOverride: cart-service
runtime: go
image:
  repository: ghcr.io/pdcthanh112/congthanhapp/cart-service
ports:
  http: 5002
  grpc: 19091
env:
  DB_SCHEMA: cart
  KAFKA_BROKERS: ecom-kafka-bootstrap.messaging.svc.cluster.local:9092
  UNLEASH_URL: http://unleash.platform.svc.cluster.local:4242/api
  PRODUCT_GRPC_ADDR: product-service:29090
  INVENTORY_GRPC_ADDR: inventory-service:9092
  JWT_JWKS_URL: http://keycloak-service.identity.svc.cluster.local:8080/realms/ecommerce/protocol/openid-connect/certs
secretEnv:
- name: DATABASE_URL
  key: ecommerce/cart-service
  property: database_url
- name: UNLEASH_TOKEN
  key: ecommerce/cart-service
  property: unleash_token
keda:
  enabled: true
  kafka:
    consumerGroup: cart-service
    topic: ecom.order.events
