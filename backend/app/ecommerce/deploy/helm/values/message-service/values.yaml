# message-service: chat khách – người bán/CSKH (GraphQL subgraph + subscription qua Valkey).
# Giá trị chung mọi môi trường; ghi đè theo môi trường ở values-<env>.yaml.
nameOverride: message-service
runtime: node
image:
  repository: ghcr.io/pdcthanh112/congthanhapp/message-service
ports:
  http: 5012
migrations:
  enabled: true
env:
  OIDC_ISSUER_URI: "http://keycloak-service.identity.svc.cluster.local:8080/realms/ecommerce"
  JWT_JWKS_URL: "http://keycloak-service.identity.svc.cluster.local:8080/realms/ecommerce/protocol/openid-connect/certs"
  DB_SCHEMA: message_service
  PRODUCT_GRPC_ADDR: "product-service:29090"
  VALKEY_URL: "redis://valkey.data.svc.cluster.local:6379/3"
  MEDIA_URL_PREFIX: "https://media.congthanh.vn/ecommerce-media/"
secretEnv:
- name: DATABASE_URL
  key: ecommerce/message-service
  property: database_url
resources:
  requests: {cpu: 100m, memory: 192Mi}
  limits: {memory: 384Mi}
