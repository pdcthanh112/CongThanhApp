# payment-service: giá trị chung mọi môi trường. Ghi đè theo môi trường ở values-<env>.yaml.
nameOverride: payment-service
runtime: java
image:
  repository: ghcr.io/pdcthanh112/congthanhapp/payment-service
ports:
  http: 5018
  grpc: 9090
env:
  # Cấu hình qua biến môi trường (application.yaml đọc env), không còn Spring profile.
  OIDC_ISSUER_URI: http://keycloak-service.identity.svc.cluster.local:8080/realms/ecommerce
  JWT_JWKS_URL: http://keycloak-service.identity.svc.cluster.local:8080/realms/ecommerce/protocol/openid-connect/certs
  OTLP_TRACES_ENDPOINT: http://otel-collector.observability.svc.cluster.local:4318/v1/traces
  TEMPORAL_ADDRESS: temporal-frontend.workflow.svc.cluster.local:7233
  TEMPORAL_NAMESPACE: ecommerce
  PAYMENT_SANDBOX_ENABLED: "false"
secretEnv:
- name: DATABASE_URL
  key: ecommerce/payment-service
  property: database_url
- name: STRIPE_API_KEY
  key: ecommerce/payment-service
  property: stripe_api_key
- name: DATABASE_USER
  key: ecommerce/payment-service
  property: database_user
- name: DATABASE_PASSWORD
  key: ecommerce/payment-service
  property: database_password
- name: STRIPE_WEBHOOK_SECRET
  key: ecommerce/payment-service
  property: stripe_webhook_secret
- name: PAYPAL_CLIENT_ID
  key: ecommerce/payment-service
  property: paypal_client_id
- name: PAYPAL_CLIENT_SECRET
  key: ecommerce/payment-service
  property: paypal_client_secret
- name: VNPAY_TMN_CODE
  key: ecommerce/payment-service
  property: vnpay_tmn_code
- name: VNPAY_HASH_SECRET
  key: ecommerce/payment-service
  property: vnpay_hash_secret
probes:
  readinessPath: /actuator/health/readiness
  livenessPath: /actuator/health/liveness
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 1Gi
serviceMonitor:
  enabled: true
  path: /actuator/prometheus
otel:
  # Spring Boot 4 tự xuất trace/metric qua Micrometer + OTLP, không cần Java agent.
  javaAutoInstrumentation: false
