# review-service: đánh giá sản phẩm, điểm trung bình (GraphQL subgraph, tiêu thụ ecom.order.events).
# Giá trị chung mọi môi trường; ghi đè theo môi trường ở values-<env>.yaml.
nameOverride: review-service
runtime: node
image:
  repository: ghcr.io/pdcthanh112/congthanhapp/review-service
ports:
  http: 5010
migrations:
  enabled: true
env:
  OIDC_ISSUER_URI: "http://keycloak-service.identity.svc.cluster.local:8080/realms/ecommerce"
  JWT_JWKS_URL: "http://keycloak-service.identity.svc.cluster.local:8080/realms/ecommerce/protocol/openid-connect/certs"
  DB_SCHEMA: review_service
  PRODUCT_GRPC_ADDR: "product-service:29090"
  KAFKA_BROKERS: "ecom-kafka-bootstrap.messaging.svc.cluster.local:9092"
  MEDIA_URL_PREFIX: "https://media.congthanh.vn/ecommerce-media/"
secretEnv:
- name: DATABASE_URL
  key: ecommerce/review-service
  property: database_url
resources:
  requests: {cpu: 100m, memory: 192Mi}
  limits: {memory: 384Mi}
keda:
  enabled: true
  kafka:
    consumerGroup: review-service
    topic: ecom.order.events
