# App-of-apps cho hạ tầng nền; sync-wave đảm bảo thứ tự (mesh/policy → secrets → data/messaging → gateway → observability).
# Operator (Strimzi, CNPG, Keycloak, OTel, Argo Rollouts, KEDA, ESO, Kyverno) cài trước bằng bootstrap/operators.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-mesh
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
  finalizers:
  - resources-finalizers.argocd.argoproj.io
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
  source:
    repoURL: https://github.com/pdcthanh112/CongThanhApp.git
    targetRevision: main
    path: backend/app/ecommerce/platform/mesh/istio
---
