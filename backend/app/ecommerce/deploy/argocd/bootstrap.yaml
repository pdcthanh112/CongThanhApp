# Bootstrap một cluster mới (sau khi Terraform tạo EKS và cài ArgoCD):
#   kubectl apply -n argocd -f backend/app/ecommerce/deploy/argocd/bootstrap.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/pdcthanh112/CongThanhApp.git
    targetRevision: main
    path: backend/app/ecommerce/deploy/argocd
    directory: {recurse: true, exclude: bootstrap.yaml}
  destination: {server: https://kubernetes.default.svc, namespace: argocd}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
