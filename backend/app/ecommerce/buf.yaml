version: v2
modules:
  - path: api/proto
lint:
  use:
    - STANDARD
  except:
    # Proto cũ dùng tên field camelCase và request/response dùng chung; sửa dần, không chặn build.
    - FIELD_LOWER_SNAKE_CASE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    - RPC_PASCAL_CASE
breaking:
  use:
    - FILE
