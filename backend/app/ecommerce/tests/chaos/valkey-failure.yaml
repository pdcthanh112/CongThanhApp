# Valkey sập 2 phút giữa flash sale. Kỳ vọng: claim trả 5xx/409 nhanh (không treo), không bán vượt,
# sau khi Valkey về thì EndFlashSale đối soát đúng; rate limit APISIX tự hạ cấp (allow_degradation).
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: valkey-failure
  namespace: data
spec:
  action: pod-failure
  mode: all
  selector:
    namespaces: [data]
    labelSelectors: {app.kubernetes.io/name: valkey}
  duration: 2m
